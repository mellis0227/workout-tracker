name: get_fit_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1


dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.4.0
  firebase_database: ^11.3.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.3
  http: ^1.3.0
  go_router: ^14.8.1
  audioplayers: ^6.4.0
  just_audio: ^0.9.46

  
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_time_picker_spinner: ^2.0.0
  wheel_picker: ^0.2.1
  ruler_slider: ^0.0.5
  image_picker: ^1.1.2
  units_converter: ^3.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/ringtones/
    - assets/images/dumbbell_dashboard.png
    - assets/images/running.png
    - assets/images/
    - assets/music/
    - assets/images/logo.png